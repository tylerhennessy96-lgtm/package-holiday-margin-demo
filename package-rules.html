<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package rules — Dynamica SmartRates</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Autopilot — scoped to .ap- */
    [hidden] { display: none !important; }

    .ap-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--body-bg);
    }
    .ap-header-row {
      flex-shrink: 0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .ap-heading {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin: 0;
    }
    .ap-master {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .ap-master .state-label { min-width: 24px; }
    .ap-master .state-label.on { color: #047857; }
    .ap-subtle { font-family:'Inter',sans-serif; font-size:12px; color:var(--text-secondary); }
    .ap-spacer { flex: 1; }
    .ap-reset-btn {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--accent-text);
      background: none;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background .12s;
    }
    .ap-reset-btn:hover { background: rgba(232,0,125,0.08); }
    .ap-park-filter {
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: 20px;
      height: 30px;
      padding: 0 28px 0 12px;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%236b7280' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
    }
    .ap-park-filter:hover { border-color: var(--accent); }

    /* KPI strip */
    .ap-kpis {
      flex-shrink: 0;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .ap-kpi {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      min-width: 150px;
      font-family: 'Inter', sans-serif;
    }
    .ap-kpi .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .ap-kpi .value {
      font-size: 19px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      margin-top: 3px;
    }
    .ap-kpi .value .unit { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-left: 4px; }
    .ap-kpi.k-auto   .value { color: #047857; }
    .ap-kpi.k-review .value { color: #b45309; }

    /* Table */
    .ap-table-wrap {
      flex: 1;
      overflow: auto;
      background: var(--surface);
    }
    table.ap-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 720px;
      max-width: 1080px;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      background: var(--surface);
    }
    table.ap-table thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 11px;
      color: var(--text-secondary);
      background: #fafbfc;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    table.ap-table thead th .sub {
      display: block;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 10px;
      margin-top: 2px;
    }
    table.ap-table tbody td {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      vertical-align: middle;
      white-space: nowrap;
      background: var(--surface);
    }
    table.ap-table tbody tr:hover td { background-color: var(--row-hover); }
    table.ap-table tbody tr.row-region td { background: #f6f8fc; font-weight: 600; }
    table.ap-table tbody tr.row-region:hover td { background: #eef2f8; }
    table.ap-table tbody tr.row-dest td { background: #fbfcfe; }
    table.ap-table tbody tr.row-dest:hover td { background: #f3f5f9; }
    table.ap-table tbody tr.row-region td.col-name { padding-left: 12px; }
    table.ap-table tbody tr.row-dest   td.col-name { padding-left: 32px; box-shadow: inset 2px 0 0 var(--border); }
    table.ap-table tbody tr.row-gw     td.col-name { padding-left: 54px; box-shadow: inset 2px 0 0 var(--border); }
    .lvl-region-name { font-weight: 600; color: var(--text-primary); }
    .lvl-dest-name   { font-weight: 500; color: var(--text-primary); }
    .lvl-gw-name     { font-weight: 400; color: var(--text-primary); }
    table.ap-table tbody tr.row-park td { background: #f6f8fc; font-weight: 600; }
    table.ap-table tbody tr.row-park:hover td { background: #eef2f8; }
    table.ap-table tbody tr.row-park td.col-name { padding-left: 12px; }
    table.ap-table tbody tr.row-week td.col-name { padding-left: 32px; box-shadow: inset 2px 0 0 var(--border); }

    .accordion-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .accordion-chev {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      color: var(--text-secondary);
      transition: transform .15s ease, background .12s, color .12s;
    }
    .accordion-name:hover .accordion-chev { background: rgba(232,0,125,0.08); color: var(--accent-text); }
    .accordion-name.expanded .accordion-chev { transform: rotate(90deg); color: var(--accent-text); }
    .lvl-park-name { font-weight: 600; color: var(--text-primary); }
    .lvl-week-name { font-weight: 500; color: var(--text-primary); }
    .park-country {
      font-weight: 400;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-left: 6px;
      letter-spacing: 0.02em;
    }
    .row-meta {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 10.5px;
    }

    /* Per-row rule controls */
    .ap-rule-cell {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-variant-numeric: tabular-nums;
    }
    .ap-rule-cell .pm, .ap-rule-cell .unit {
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    input.ap-thresh {
      width: 56px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: right;
      font-variant-numeric: tabular-nums;
      background: var(--surface);
      transition: border-color .12s;
    }
    input.ap-thresh:hover { border-color: var(--accent); }
    input.ap-thresh:focus { outline: 1.5px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    /* Inherited values read muted; explicit overrides read accented */
    input.ap-thresh.inherited { color: var(--text-muted); }
    input.ap-thresh.custom { border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    .ap-inherit-reset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      line-height: 1;
      transition: color .12s, background .12s;
    }
    .ap-inherit-reset:hover { color: var(--accent-text); background: rgba(232,0,125,0.08); }
    .ap-inherit-reset[hidden] { display: none; }

    .ap-note {
      padding: 14px 24px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 720px;
    }

    /* ── Rules builder (two-pane: list + editor) ── */
    .rules-shell {
      flex: 1;
      display: flex;
      overflow: hidden;
      background: var(--body-bg);
      border-top: 1px solid var(--border);
    }
    .rules-list-pane {
      width: 380px;
      min-width: 380px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .rules-list-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .rules-list-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .btn-primary {
      background: var(--accent); color: var(--accent-on);
      border: 1px solid var(--accent); border-radius: var(--radius);
      font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer;
      padding: 6px 12px; font-size: 11.5px;
      transition: background .12s;
    }
    .btn-primary:hover { background: var(--accent-dim); }
    .rules-list { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .rule-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 13px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .rule-card:hover { border-color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .rule-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,0,125,.15); }
    .rc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
    .rc-name { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
    .rule-status {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
      letter-spacing: .3px; text-transform: uppercase; white-space: nowrap;
    }
    .rule-status.rs-active   { background: rgba(232,0,125,0.12); color: #c2185b; }
    .rule-status.rs-inactive { background: #f3f4f6; color: var(--text-secondary); }
    .rule-status.rs-draft    { background: rgba(245,166,35,0.16); color: #b45309; }
    .rc-meta { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
    .rc-cond {
      font-size: 10.5px; color: var(--text-primary);
      padding: 4px 7px; background: #f9fafb; border-radius: 3px; margin-top: 4px;
      font-family: 'JetBrains Mono', monospace; line-height: 1.4;
    }
    .rc-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
      font-size: 10.5px; color: var(--text-muted);
    }
    .rc-actions { display: flex; gap: 4px; }
    .rc-icon-btn {
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      padding: 2px 5px; border-radius: 3px; font-size: 11px; font-family: 'Inter', sans-serif;
    }
    .rc-icon-btn:hover { color: var(--accent-text); background: #f3f4f6; }
    .rules-editor-pane { flex: 1; overflow-y: auto; background: var(--body-bg); padding: 22px 28px; }
    .rules-editor {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 22px 24px; max-width: 780px;
    }
    .re-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .re-header h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .re-field { margin-bottom: 16px; }
    .re-label {
      display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
    }
    .re-input, .re-select {
      width: 100%; padding: 7px 10px;
      border: 1px solid var(--border-mid); border-radius: var(--radius);
      background: var(--surface); font-family: 'Inter', sans-serif;
      font-size: 12.5px; color: var(--text-primary);
    }
    .re-input:focus, .re-select:focus { outline: 1.5px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    .re-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .re-cond-row {
      display: grid; grid-template-columns: 1.4fr 0.8fr 1fr 32px;
      gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .re-x {
      background: none; border: 1px solid var(--border-mid); border-radius: var(--radius);
      color: var(--text-muted); cursor: pointer; height: 32px; font-size: 13px;
    }
    .re-x:hover { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
    .re-add {
      background: none; border: 1px dashed var(--border-mid); border-radius: var(--radius);
      color: var(--text-secondary); cursor: pointer; padding: 7px 12px;
      font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 500;
    }
    .re-add:hover { border-color: var(--accent); color: var(--accent-text); }
    .re-logic { display: inline-flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 11.5px; color: var(--text-secondary); }
    .re-cb, .re-radio { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-primary); margin-right: 14px; cursor: pointer; }
    .re-cb input, .re-radio input { accent-color: var(--accent); }
    .re-actions-bar {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border-mid); border-radius: var(--radius);
      font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
      padding: 8px 16px; cursor: pointer;
    }
    .btn-ghost:hover { background: #f3f4f8; color: var(--text-primary); }
    .rules-editor-empty { display: flex; align-items: center; justify-content: center; height: 100%; }
    .re-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Top Nav ── -->
  <nav class="topnav">
    <button class="burger-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="appDrawer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6"  x2="17" y2="6"/>
        <line x1="3" y1="10" x2="17" y2="10"/>
        <line x1="3" y1="14" x2="17" y2="14"/>
      </svg>
    </button>
    <a href="index.html" style="display:flex;align-items:center;gap:8px;margin-right:32px;text-decoration:none;flex-shrink:0;">
      <img src="engine_logo (2).png" style="height:28px;width:auto;display:block;" alt="Dynamica SmartRates">
      <div style="display:flex;flex-direction:column;line-height:1;gap:2px;">
        <span style="font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.18em;color:#ffffff;text-transform:uppercase;">DYNAMICA</span>
        <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:400;letter-spacing:0.02em;color:rgba(255,255,255,0.55);">SmartRates</span>
      </div>
    </a>
  </nav>

  <main class="ap-page">

    <div class="ap-header-row">
      <h1 class="ap-heading">Package rules</h1>
      <span class="ap-subtle">Conditions and margin actions — evaluated top to bottom, first match wins</span>
      <div class="ap-spacer"></div>
      <button class="ap-reset-btn" type="button" id="rulesReset">Reset to defaults</button>
    </div>

    <div class="ap-kpis" id="apKpis"></div>

    <div class="rules-shell">
      <div class="rules-list-pane">
        <div class="rules-list-head">
          <div class="rules-list-title">Rules</div>
          <button class="btn-primary" type="button" id="newRuleBtn">+ New rule</button>
        </div>
        <div class="rules-list" id="rulesList"></div>
      </div>
      <div class="rules-editor-pane">
        <div class="rules-editor-empty" id="rulesEditorEmpty">
          <div style="font-size:13px;color:var(--text-muted);text-align:center;padding:60px 20px;">
            Select a rule to edit, or click <strong>+ New rule</strong> to create one.
          </div>
        </div>
        <div class="rules-editor" id="rulesEditor" style="display:none;"></div>
      </div>
    </div>

  </main>
</div>

      <li>
        <a href="settings.html" class="drawer-item">

              <circle cx="9" cy="9" r="2.2"/>

            </svg>
          </span>
          Log out
        </button>
      </li>
    </ul>
  </nav>
</aside>
<div class="logout-overlay" aria-hidden="true">
  <div class="logout-spinner"></div>
</div>

<div class="app-toast" id="appToast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script>
(function () {
  const REGIONS = ['All regions','Western Mediterranean','Eastern Mediterranean','Canaries & Atlantic','Caribbean & Mexico'];
  const DESTS = ['All destinations','Faro — Algarve','Palma — Mallorca','Alicante — Costa Blanca',
    'Heraklion — Crete','Antalya — Turkey','Paphos — Cyprus','Tenerife South','Lanzarote — Arrecife',
    'Funchal — Madeira','Cancún — Mexico','Punta Cana — Dominican Rep.','Montego Bay — Jamaica'];
  const GATEWAYS = ['All gateways','London Gatwick','Manchester','Birmingham','Glasgow','Bristol','London Stansted','Newcastle','Edinburgh'];
  const METRICS = ['Demand level','Web sessions','Conversion %','Booking pace %','Package margin %','Supplement margin %','% target sold','Days to departure','Always apply'];
  const OPS = ['>','<','=','>=','<=','between'];
  const ACTIONS = ['Increase margin by ppt','Decrease margin by ppt','Set margin to %','Cap margin at %','Floor margin at %','Hold margin','Flag for review'];
  const DEPARTURE_TYPES = ['Any','Weekday','Weekend','School holiday'];

  const KEY = 'dynamica.smartrates.packageRules';
  const DEFAULTS = [
    { id:'r1', name:'High demand — take margin', status:'Active', region:'All regions', dest:'All destinations', gateway:'All gateways',
      departureType:'Any', logic:'ALL',
      conditions:[{metric:'Demand level',op:'>=',value:'DL4'},{metric:'Booking pace %',op:'>',value:'5'}],
      action:{type:'Increase margin by ppt', value:'2.5'}, modified:'2026-07-24', by:'T. Hennessy' },
    { id:'r2', name:'Soft demand — release margin', status:'Active', region:'All regions', dest:'All destinations', gateway:'All gateways',
      departureType:'Any', logic:'ALL',
      conditions:[{metric:'Demand level',op:'<=',value:'DL2'},{metric:'% target sold',op:'<',value:'80'}],
      action:{type:'Decrease margin by ppt', value:'2.0'}, modified:'2026-07-24', by:'T. Hennessy' },
    { id:'r3', name:'Margin floor — never sell below 18%', status:'Active', region:'All regions', dest:'All destinations', gateway:'All gateways',
      departureType:'Any', logic:'ALL',
      conditions:[{metric:'Package margin %',op:'<',value:'18'}],
      action:{type:'Floor margin at %', value:'18'}, modified:'2026-07-22', by:'System' },
    { id:'r4', name:'Caribbean — protect margin close to departure', status:'Active', region:'Caribbean & Mexico', dest:'All destinations', gateway:'All gateways',
      departureType:'Any', logic:'ALL',
      conditions:[{metric:'Days to departure',op:'<',value:'21'},{metric:'Package margin %',op:'<',value:'25'}],
      action:{type:'Hold margin', value:''}, modified:'2026-07-20', by:'T. Hennessy' },
    { id:'r5', name:'Weak conversion — flag for review', status:'Draft', region:'All regions', dest:'All destinations', gateway:'All gateways',
      departureType:'Any', logic:'ALL',
      conditions:[{metric:'Conversion %',op:'<',value:'2.6'},{metric:'Web sessions',op:'>',value:'5000'}],
      action:{type:'Flag for review', value:''}, modified:'2026-07-25', by:'T. Hennessy' },
    { id:'r6', name:'School holidays — cap margin at 45%', status:'Inactive', region:'All regions', dest:'All destinations', gateway:'All gateways',
      departureType:'School holiday', logic:'ALL',
      conditions:[{metric:'Always apply',op:'>',value:''}],
      action:{type:'Cap margin at %', value:'45'}, modified:'2026-07-18', by:'System' },
  ];

  function load(){
    try{ const raw=localStorage.getItem(KEY); if(!raw) return JSON.parse(JSON.stringify(DEFAULTS));
      const p=JSON.parse(raw); return Array.isArray(p)&&p.length?p:JSON.parse(JSON.stringify(DEFAULTS)); }
    catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(rules)); }
  let rules = load();
  let selectedId = null;
  let draft = null;

  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const opts=(vals,sel)=>vals.map(v=>'<option value="'+esc(v)+'"'+(String(sel)===String(v)?' selected':'')+'>'+esc(v)+'</option>').join('');
  function condStr(c){
    if(c.metric==='Always apply') return 'Always apply';
    return c.metric+' '+c.op+' '+(c.value===''?'—':c.value);
  }
  function actionStr(a){ return a.value!=='' && a.value!=null ? a.type+' '+a.value : a.type; }
  function scopeStr(r){
    const bits=[];
    if(r.region!=='All regions') bits.push(r.region);
    if(r.dest!=='All destinations') bits.push(r.dest);
    if(r.gateway!=='All gateways') bits.push(r.gateway);
    if(r.departureType && r.departureType!=='Any') bits.push(r.departureType);
    return bits.length?bits.join(' · '):'All packages';
  }

  function renderKpis(){
    const active=rules.filter(r=>r.status==='Active').length;
    const draftN=rules.filter(r=>r.status==='Draft').length;
    document.getElementById('apKpis').innerHTML =
      '<div class="ap-kpi"><div class="label">Rules</div><div class="value">'+rules.length+'</div></div>'+
      '<div class="ap-kpi k-auto"><div class="label">Active</div><div class="value">'+active+'</div></div>'+
      '<div class="ap-kpi k-review"><div class="label">Draft</div><div class="value">'+draftN+'</div></div>'+
      '<div class="ap-kpi"><div class="label">Evaluation</div><div class="value" style="font-size:14px;">Top to bottom · first match wins</div></div>';
  }

  function renderList(){
    const list=document.getElementById('rulesList');
    if(!rules.length){ list.innerHTML='<div style="padding:26px 14px;text-align:center;color:var(--text-muted);font-size:12px;">No package rules yet.</div>'; return; }
    list.innerHTML = rules.map(r=>{
      const sCls = r.status==='Active'?'rs-active':r.status==='Draft'?'rs-draft':'rs-inactive';
      const cond = (r.conditions||[]).map(condStr).join(r.logic==='ANY'?'  OR  ':'  AND  ');
      return '<div class="rule-card'+(r.id===selectedId?' active':'')+'" data-id="'+esc(r.id)+'">'+
        '<div class="rc-top"><div class="rc-name">'+esc(r.name||'Untitled rule')+'</div>'+
          '<span class="rule-status '+sCls+'">'+esc(r.status)+'</span></div>'+
        '<div class="rc-meta">'+esc(scopeStr(r))+'</div>'+
        '<div class="rc-cond">'+esc(cond||'No conditions')+'</div>'+
        '<div class="rc-meta" style="margin-top:6px;">→ '+esc(actionStr(r.action))+'</div>'+
        '<div class="rc-foot"><span>Modified '+esc(r.modified)+' · '+esc(r.by)+'</span>'+
          '<div class="rc-actions">'+
            '<button type="button" class="rc-icon-btn" data-act="edit" data-id="'+esc(r.id)+'">Edit</button>'+
            '<button type="button" class="rc-icon-btn" data-act="toggle" data-id="'+esc(r.id)+'">'+(r.status==='Active'?'Pause':'Run')+'</button>'+
            '<button type="button" class="rc-icon-btn" data-act="delete" data-id="'+esc(r.id)+'">Delete</button>'+
          '</div></div></div>';
    }).join('');
  }

  function renderEditor(){
    const empty=document.getElementById('rulesEditorEmpty');
    const ed=document.getElementById('rulesEditor');
    if(!draft){ empty.style.display=''; ed.style.display='none'; return; }
    empty.style.display='none'; ed.style.display='';
    const d=draft;
    const noVal = d.action.type==='Hold margin' || d.action.type==='Flag for review';
    const condRows=(d.conditions||[]).map((c,i)=>
      '<div class="re-cond-row">'+
        '<select class="re-select" data-cond="'+i+'" data-f="metric">'+opts(METRICS,c.metric)+'</select>'+
        '<select class="re-select" data-cond="'+i+'" data-f="op"'+(c.metric==='Always apply'?' disabled':'')+'>'+opts(OPS,c.op)+'</select>'+
        '<input class="re-input" data-cond="'+i+'" data-f="value" value="'+esc(c.value)+'"'+(c.metric==='Always apply'?' disabled':'')+'>'+
        '<button type="button" class="re-x" data-cond-remove="'+i+'" aria-label="Remove condition">×</button>'+
      '</div>').join('');
    ed.innerHTML =
      '<div class="re-header"><h3>'+esc(d.name||'New rule')+'</h3>'+
        '<span class="rule-status '+(d.status==='Active'?'rs-active':d.status==='Draft'?'rs-draft':'rs-inactive')+'">'+esc(d.status)+'</span></div>'+
      '<div class="re-field"><label class="re-label" for="rName">Rule name</label>'+
        '<input class="re-input" id="rName" value="'+esc(d.name)+'"></div>'+
      '<div class="re-grid">'+
        '<div class="re-field"><label class="re-label" for="rRegion">Region</label><select class="re-select" id="rRegion">'+opts(REGIONS,d.region)+'</select></div>'+
        '<div class="re-field"><label class="re-label" for="rDest">Destination</label><select class="re-select" id="rDest">'+opts(DESTS,d.dest)+'</select></div>'+
        '<div class="re-field"><label class="re-label" for="rGw">Gateway</label><select class="re-select" id="rGw">'+opts(GATEWAYS,d.gateway)+'</select></div>'+
        '<div class="re-field"><label class="re-label" for="rDep">Departure type</label><select class="re-select" id="rDep">'+opts(DEPARTURE_TYPES,d.departureType||'Any')+'</select></div>'+
      '</div>'+
      '<div class="re-field"><label class="re-label">Conditions</label>'+
        '<div class="re-logic">Match'+
          '<label class="re-radio"><input type="radio" name="rLogic" value="ALL"'+(d.logic!=='ANY'?' checked':'')+'> all</label>'+
          '<label class="re-radio"><input type="radio" name="rLogic" value="ANY"'+(d.logic==='ANY'?' checked':'')+'> any</label>'+
        '</div>'+
        condRows+
        '<button type="button" class="re-add" id="addCond">+ Add condition</button>'+
      '</div>'+
      '<div class="re-grid">'+
        '<div class="re-field"><label class="re-label" for="rAction">Action</label><select class="re-select" id="rAction">'+opts(ACTIONS,d.action.type)+'</select></div>'+
        '<div class="re-field"><label class="re-label" for="rActionVal">Value</label>'+
          '<input class="re-input" id="rActionVal" value="'+esc(d.action.value)+'"'+(noVal?' disabled placeholder="not required"':'')+'></div>'+
      '</div>'+
      '<div class="re-field"><label class="re-label" for="rStatus">Status</label>'+
        '<select class="re-select" id="rStatus">'+opts(['Active','Draft','Inactive'],d.status)+'</select>'+
        '<div class="re-hint">Rules are evaluated in list order; the first rule whose conditions match sets the margin action for that package.</div></div>'+
      '<div class="re-actions-bar">'+
        '<button type="button" class="btn-ghost" id="cancelRule">Cancel</button>'+
        '<button type="button" class="btn-primary" id="saveRule">Save rule</button>'+
      '</div>';
  }

  function renderAll(){ renderKpis(); renderList(); renderEditor(); }

  function blankRule(){
    return { id:'r'+Date.now(), name:'New rule', status:'Draft', region:'All regions', dest:'All destinations',
      gateway:'All gateways', departureType:'Any', logic:'ALL',
      conditions:[{metric:'Demand level',op:'>=',value:'DL4'}],
      action:{type:'Increase margin by ppt', value:'1.0'},
      modified:'2026-07-27', by:'T. Hennessy' };
  }

  // ── Events ──
  document.getElementById('newRuleBtn').addEventListener('click',()=>{
    draft=blankRule(); selectedId=null; renderAll();
  });
  document.getElementById('rulesList').addEventListener('click',e=>{
    const btn=e.target.closest('.rc-icon-btn');
    if(btn){
      e.stopPropagation();
      const id=btn.dataset.id; const i=rules.findIndex(r=>r.id===id);
      if(i<0) return;
      if(btn.dataset.act==='delete'){ rules.splice(i,1); if(selectedId===id){selectedId=null;draft=null;} save(); renderAll(); return; }
      if(btn.dataset.act==='toggle'){ rules[i].status = rules[i].status==='Active'?'Inactive':'Active'; save(); renderAll(); return; }
      selectedId=id; draft=JSON.parse(JSON.stringify(rules[i])); renderAll(); return;
    }
    const card=e.target.closest('.rule-card');
    if(!card) return;
    selectedId=card.dataset.id;
    const r=rules.find(x=>x.id===selectedId);
    draft = r?JSON.parse(JSON.stringify(r)):null;
    renderAll();
  });

  const ed=document.getElementById('rulesEditor');
  ed.addEventListener('input',e=>{
    if(!draft) return;
    const t=e.target;
    if(t.id==='rName') draft.name=t.value;
    else if(t.id==='rActionVal') draft.action.value=t.value;
    else if(t.dataset.cond!=null && t.dataset.f==='value') draft.conditions[+t.dataset.cond].value=t.value;
  });
  ed.addEventListener('change',e=>{
    if(!draft) return;
    const t=e.target;
    if(t.id==='rRegion') draft.region=t.value;
    else if(t.id==='rDest') draft.dest=t.value;
    else if(t.id==='rGw') draft.gateway=t.value;
    else if(t.id==='rDep') draft.departureType=t.value;
    else if(t.id==='rStatus'){ draft.status=t.value; renderEditor(); }
    else if(t.id==='rAction'){ draft.action.type=t.value; renderEditor(); }
    else if(t.name==='rLogic') draft.logic=t.value;
    else if(t.dataset.cond!=null){
      const c=draft.conditions[+t.dataset.cond];
      c[t.dataset.f]=t.value;
      if(t.dataset.f==='metric') renderEditor();
    }
  });
  ed.addEventListener('click',e=>{
    if(!draft) return;
    if(e.target.id==='addCond'){ draft.conditions.push({metric:'Package margin %',op:'<',value:'20'}); renderEditor(); return; }
    const rm=e.target.closest('[data-cond-remove]');
    if(rm){ draft.conditions.splice(+rm.dataset.condRemove,1); renderEditor(); return; }
    if(e.target.id==='cancelRule'){ draft=null; selectedId=null; renderAll(); return; }
    if(e.target.id==='saveRule'){
      draft.modified='2026-07-27';
      const i=rules.findIndex(r=>r.id===draft.id);
      if(i>=0) rules[i]=draft; else rules.push(draft);
      selectedId=draft.id;
      draft=JSON.parse(JSON.stringify(draft));
      save(); renderAll();
      const t=document.getElementById('appToast');
      t.textContent='Rule saved'; t.classList.add('show');
      clearTimeout(window.__rt); window.__rt=setTimeout(()=>t.classList.remove('show'),2200);
    }
  });

  document.getElementById('rulesReset').addEventListener('click',()=>{
    rules=JSON.parse(JSON.stringify(DEFAULTS)); selectedId=null; draft=null; save(); renderAll();
  });

  renderAll();
})();
</script>

</body>
</html>
