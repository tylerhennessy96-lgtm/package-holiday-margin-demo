<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Margin rules — Dynamica SmartRates</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Autopilot — scoped to .ap- */
    [hidden] { display: none !important; }

    .ap-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--body-bg);
    }
    .ap-header-row {
      flex-shrink: 0;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .ap-heading {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin: 0;
    }
    .ap-master {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .ap-master .state-label { min-width: 24px; }
    .ap-master .state-label.on { color: #047857; }
    .ap-subtle { font-family:'Inter',sans-serif; font-size:12px; color:var(--text-secondary); }
    .ap-spacer { flex: 1; }
    .ap-reset-btn {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--accent-text);
      background: none;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background .12s;
    }
    .ap-reset-btn:hover { background: rgba(232,0,125,0.08); }
    .ap-park-filter {
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: 20px;
      height: 30px;
      padding: 0 28px 0 12px;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%236b7280' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
    }
    .ap-park-filter:hover { border-color: var(--accent); }

    /* KPI strip */
    .ap-kpis {
      flex-shrink: 0;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .ap-kpi {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      min-width: 150px;
      font-family: 'Inter', sans-serif;
    }
    .ap-kpi .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .ap-kpi .value {
      font-size: 19px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      margin-top: 3px;
    }
    .ap-kpi .value .unit { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-left: 4px; }
    .ap-kpi.k-auto   .value { color: #047857; }
    .ap-kpi.k-review .value { color: #b45309; }

    /* Table */
    .ap-table-wrap {
      flex: 1;
      overflow: auto;
      background: var(--surface);
    }
    table.ap-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 720px;
      max-width: 1080px;
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      background: var(--surface);
    }
    table.ap-table thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 11px;
      color: var(--text-secondary);
      background: #fafbfc;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    table.ap-table thead th .sub {
      display: block;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 10px;
      margin-top: 2px;
    }
    table.ap-table tbody td {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      vertical-align: middle;
      white-space: nowrap;
      background: var(--surface);
    }
    table.ap-table tbody tr:hover td { background-color: var(--row-hover); }
    table.ap-table tbody tr.row-region td { background: #f6f8fc; font-weight: 600; }
    table.ap-table tbody tr.row-region:hover td { background: #eef2f8; }
    table.ap-table tbody tr.row-dest td { background: #fbfcfe; }
    table.ap-table tbody tr.row-dest:hover td { background: #f3f5f9; }
    table.ap-table tbody tr.row-region td.col-name { padding-left: 12px; }
    table.ap-table tbody tr.row-dest   td.col-name { padding-left: 32px; box-shadow: inset 2px 0 0 var(--border); }
    table.ap-table tbody tr.row-gw     td.col-name { padding-left: 54px; box-shadow: inset 2px 0 0 var(--border); }
    .lvl-region-name { font-weight: 600; color: var(--text-primary); }
    .lvl-dest-name   { font-weight: 500; color: var(--text-primary); }
    .lvl-gw-name     { font-weight: 400; color: var(--text-primary); }
    table.ap-table tbody tr.row-park td { background: #f6f8fc; font-weight: 600; }
    table.ap-table tbody tr.row-park:hover td { background: #eef2f8; }
    table.ap-table tbody tr.row-park td.col-name { padding-left: 12px; }
    table.ap-table tbody tr.row-week td.col-name { padding-left: 32px; box-shadow: inset 2px 0 0 var(--border); }

    .accordion-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .accordion-chev {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      color: var(--text-secondary);
      transition: transform .15s ease, background .12s, color .12s;
    }
    .accordion-name:hover .accordion-chev { background: rgba(232,0,125,0.08); color: var(--accent-text); }
    .accordion-name.expanded .accordion-chev { transform: rotate(90deg); color: var(--accent-text); }
    .lvl-park-name { font-weight: 600; color: var(--text-primary); }
    .lvl-week-name { font-weight: 500; color: var(--text-primary); }
    .park-country {
      font-weight: 400;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-left: 6px;
      letter-spacing: 0.02em;
    }
    .row-meta {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 10.5px;
    }

    /* Per-row rule controls */
    .ap-rule-cell {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-variant-numeric: tabular-nums;
    }
    .ap-rule-cell .pm, .ap-rule-cell .unit {
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    input.ap-thresh {
      width: 56px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--border-mid);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: right;
      font-variant-numeric: tabular-nums;
      background: var(--surface);
      transition: border-color .12s;
    }
    input.ap-thresh:hover { border-color: var(--accent); }
    input.ap-thresh:focus { outline: 1.5px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    /* Inherited values read muted; explicit overrides read accented */
    input.ap-thresh.inherited { color: var(--text-muted); }
    input.ap-thresh.custom { border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    .ap-inherit-reset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      font-size: 12px;
      line-height: 1;
      transition: color .12s, background .12s;
    }
    .ap-inherit-reset:hover { color: var(--accent-text); background: rgba(232,0,125,0.08); }
    .ap-inherit-reset[hidden] { display: none; }

    .ap-note {
      padding: 14px 24px 24px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 720px;
    }

    /* ── Rules builder (two-pane: list + editor) ── */
    .rules-shell {
      flex: 1;
      display: flex;
      overflow: hidden;
      background: var(--body-bg);
      border-top: 1px solid var(--border);
    }
    .rules-list-pane {
      width: 380px;
      min-width: 380px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .rules-list-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .rules-list-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .btn-primary {
      background: var(--accent); color: var(--accent-on);
      border: 1px solid var(--accent); border-radius: var(--radius);
      font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer;
      padding: 6px 12px; font-size: 11.5px;
      transition: background .12s;
    }
    .btn-primary:hover { background: var(--accent-dim); }
    .rules-list { flex: 1; overflow-y: auto; padding: 10px 12px; }
    .rule-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 13px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .rule-card:hover { border-color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .rule-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(232,0,125,.15); }
    .rc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
    .rc-name { font-size: 12.5px; font-weight: 600; color: var(--text-primary); }
    .rule-status {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
      letter-spacing: .3px; text-transform: uppercase; white-space: nowrap;
    }
    .rule-status.rs-active   { background: rgba(232,0,125,0.12); color: #c2185b; }
    .rule-status.rs-inactive { background: #f3f4f6; color: var(--text-secondary); }
    .rule-status.rs-draft    { background: rgba(245,166,35,0.16); color: #b45309; }
    .rc-meta { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
    .rc-cond {
      font-size: 10.5px; color: var(--text-primary);
      padding: 4px 7px; background: #f9fafb; border-radius: 3px; margin-top: 4px;
      font-family: 'JetBrains Mono', monospace; line-height: 1.4;
    }
    .rc-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
      font-size: 10.5px; color: var(--text-muted);
    }
    .rc-actions { display: flex; gap: 4px; }
    .rc-icon-btn {
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      padding: 2px 5px; border-radius: 3px; font-size: 11px; font-family: 'Inter', sans-serif;
    }
    .rc-icon-btn:hover { color: var(--accent-text); background: #f3f4f6; }
    .rules-editor-pane { flex: 1; overflow-y: auto; background: var(--body-bg); padding: 22px 28px; }
    .rules-editor {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 22px 24px; max-width: 780px;
    }
    .re-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .re-header h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .re-field { margin-bottom: 16px; }
    .re-label {
      display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
    }
    .re-input, .re-select {
      width: 100%; padding: 7px 10px;
      border: 1px solid var(--border-mid); border-radius: var(--radius);
      background: var(--surface); font-family: 'Inter', sans-serif;
      font-size: 12.5px; color: var(--text-primary);
    }
    .re-input:focus, .re-select:focus { outline: 1.5px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    .re-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .re-cond-row {
      display: grid; grid-template-columns: 1.4fr 0.8fr 1fr 32px;
      gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .re-x {
      background: none; border: 1px solid var(--border-mid); border-radius: var(--radius);
      color: var(--text-muted); cursor: pointer; height: 32px; font-size: 13px;
    }
    .re-x:hover { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
    .re-add {
      background: none; border: 1px dashed var(--border-mid); border-radius: var(--radius);
      color: var(--text-secondary); cursor: pointer; padding: 7px 12px;
      font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 500;
    }
    .re-add:hover { border-color: var(--accent); color: var(--accent-text); }
    .re-logic { display: inline-flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 11.5px; color: var(--text-secondary); }
    .re-cb, .re-radio { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-primary); margin-right: 14px; cursor: pointer; }
    .re-cb input, .re-radio input { accent-color: var(--accent); }
    .re-actions-bar {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
    }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border-mid); border-radius: var(--radius);
      font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
      padding: 8px 16px; cursor: pointer;
    }
    .btn-ghost:hover { background: #f3f4f8; color: var(--text-primary); }
    .rules-editor-empty { display: flex; align-items: center; justify-content: center; height: 100%; }
    .re-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }

    /* ── Margin-rule matrix ── */
    .mx-wrap { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
    .mx-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; max-width: 1280px; }
    .mx-group {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); margin-bottom: 14px; overflow: hidden;
    }
    .mx-group-head {
      display: flex; align-items: baseline; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fafbfc;
    }
    .mx-group-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .mx-group-metric { font-size: 11px; color: var(--text-muted); }
    .mx-group-sum { margin-left: auto; font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    table.mx-bands { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.mx-bands td { padding: 8px 16px; border-bottom: 1px solid var(--border); }
    table.mx-bands tr:last-child td { border-bottom: none; }
    table.mx-bands tr:hover td { background: var(--row-hover); }
    .mx-cond { color: var(--text-primary); }
    .mx-input-cell { width: 132px; text-align: right; white-space: nowrap; }
    input.mx-input {
      width: 68px; height: 28px; padding: 0 8px;
      border: 1px solid var(--border-mid); border-radius: var(--radius);
      font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
      color: var(--text-primary); text-align: right; font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }
    input.mx-input::-webkit-outer-spin-button, input.mx-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input.mx-input:hover { border-color: var(--accent); }
    input.mx-input:focus { outline: 1.5px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    input.mx-input.pos { color: #166534; }
    input.mx-input.neg { color: #991b1b; }
    .mx-unit { font-size: 11px; color: var(--text-muted); margin-left: 6px; }

    .mx-side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 14px; }
    .mx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
    .mx-card-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted); margin-bottom: 12px;
    }
    .mx-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 12.5px; }
    .mx-row label { color: var(--text-secondary); }
    .mx-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
    .mx-base-input { width: 78px; }
    .mx-example td { padding: 5px 0; font-size: 12px; border-bottom: 1px solid var(--border); }
    .mx-example tr:last-child td { border-bottom: none; }
    .mx-example .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    .mx-example .up { color: #166534; } .mx-example .down { color: #991b1b; } .mx-example .flat { color: var(--text-muted); }
    .mx-example tr.total td { border-top: 1.5px solid var(--border-mid); font-weight: 700; padding-top: 8px; }
    .mx-hint { font-size: 11px; color: var(--text-muted); line-height: 1.55; margin-top: 10px; }
    @media (max-width: 1180px) { .mx-layout { grid-template-columns: 1fr; } .mx-side { position: static; } }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Top Nav ── -->
  <nav class="topnav">
    <button class="burger-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="appDrawer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6"  x2="17" y2="6"/>
        <line x1="3" y1="10" x2="17" y2="10"/>
        <line x1="3" y1="14" x2="17" y2="14"/>
      </svg>
    </button>
    <a href="index.html" style="display:flex;align-items:center;gap:8px;margin-right:32px;text-decoration:none;flex-shrink:0;">
      <img src="engine_logo (2).png" style="height:28px;width:auto;display:block;" alt="Dynamica SmartRates">
      <div style="display:flex;flex-direction:column;line-height:1;gap:2px;">
        <span style="font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.18em;color:#ffffff;text-transform:uppercase;">DYNAMICA</span>
        <span style="font-family:'Inter',sans-serif;font-size:12px;font-weight:400;letter-spacing:0.02em;color:rgba(255,255,255,0.55);">SmartRates</span>
      </div>
    </a>
  </nav>

  <main class="ap-page">

    <div class="ap-header-row">
      <h1 class="ap-heading">Margin rules</h1>
      <span class="ap-subtle">Additive matrix — base margin plus one adjustment per factor, then guardrails</span>
      <div class="ap-spacer"></div>
      <button class="ap-reset-btn" type="button" id="mxReset">Reset to defaults</button>
    </div>

    <div class="ap-kpis" id="apKpis"></div>

    <div class="mx-wrap">
      <div class="mx-layout">
        <div id="mxGroups"></div>
        <aside class="mx-side" id="mxSide"></aside>
      </div>
    </div>

  </main>
</div>

<!-- ── Slide-out drawer ── -->
<div class="drawer-backdrop"></div>
<aside class="drawer" id="appDrawer" aria-label="Main menu">
  <div class="drawer-header">
    <img src="engine_logo (2).png" alt="Dynamica">
    <div class="drawer-brand">
      <span class="wordmark">DYNAMICA</span>
      <span class="sub">SmartRates</span>
    </div>
    <button class="drawer-close" type="button" aria-label="Close menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <line x1="4"  y1="4"  x2="14" y2="14"/>
        <line x1="14" y1="4"  x2="4"  y2="14"/>
      </svg>
    </button>
  </div>
  <nav>
    <ul class="drawer-menu">
      <li>
        <a href="index.html" class="drawer-item">
          <span class="drawer-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5"  y="9"  width="3" height="6"  rx="0.8"/>
              <rect x="7.5"  y="5"  width="3" height="10" rx="0.8"/>
              <rect x="12.5" y="2"  width="3" height="13" rx="0.8"/>
            </svg>
          </span>
          Pricing
        </a>
      </li>
      <li>

<script src="app.js"></script>
<script>
(function () {
  const KEY = 'dynamica.smartrates.marginMatrix';
  const DEFAULTS = {
    baseMargin: 12.0,
    guardrails: { minMargin: 6.0, maxMargin: 18.0, maxUplift: 6.0, maxReduction: 6.0, minContribution: 75, learningRange: 1.5 },
    groups: [
      { id:'comp', label:'Competitive position', metric:'Price vs competitor benchmark', bands:[
        { id:'c1', label:'More than 5% below competitor', ppt: 2.0 },
        { id:'c2', label:'2–5% below competitor',         ppt: 1.0 },
        { id:'c3', label:'Within ±2% of competitor',      ppt: 0.0 },
        { id:'c4', label:'2–5% above competitor',         ppt:-1.0 },
        { id:'c5', label:'More than 5% above competitor', ppt:-2.0 } ] },
      { id:'demand', label:'Demand and conversion', metric:'Observed demand vs conversion target', bands:[
        { id:'d1', label:'Demand high, conversion above target', ppt: 2.0 },
        { id:'d2', label:'Demand high, conversion in line',      ppt: 1.0 },
        { id:'d3', label:'Demand and conversion in line',        ppt: 0.0 },
        { id:'d4', label:'Conversion moderately below target',   ppt:-1.0 },
        { id:'d5', label:'Conversion materially below target',   ppt:-2.0 } ] },
      { id:'basket', label:'Basket value', metric:'Total package value per booking', bands:[
        { id:'b1', label:'Below £750',      ppt: 1.5 },
        { id:'b2', label:'£750–£1,499',     ppt: 0.5 },
        { id:'b3', label:'£1,500–£2,999',   ppt: 0.0 },
        { id:'b4', label:'£3,000–£4,999',   ppt:-0.5 },
        { id:'b5', label:'£5,000 or above', ppt:-1.0 } ] },
      { id:'channel', label:'Booking channel', metric:'Acquisition channel mix (blended by share)', bands:[
        { id:'direct',    label:'Direct / organic', ppt:-0.5 },
        { id:'crm',       label:'CRM / email',      ppt: 0.0 },
        { id:'paid',      label:'Paid search',      ppt: 0.5 },
        { id:'meta',      label:'Metasearch',       ppt: 1.0 },
        { id:'affiliate', label:'Affiliate',        ppt: 1.5 } ] },
      { id:'window', label:'Departure window', metric:'Days until departure', bands:[
        { id:'w1', label:'Within 7 days',      ppt: 1.5 },
        { id:'w2', label:'8–30 days',          ppt: 1.0 },
        { id:'w3', label:'31–90 days',         ppt: 0.0 },
        { id:'w4', label:'91–180 days',        ppt:-0.5 },
        { id:'w5', label:'More than 180 days', ppt:-1.0 } ] },
      { id:'supplier', label:'Supplier cost advantage', metric:'Package cost vs benchmark', bands:[
        { id:'s1', label:'More than 7% better than benchmark', ppt: 2.0 },
        { id:'s2', label:'3–7% better than benchmark',         ppt: 1.0 },
        { id:'s3', label:'Within ±3% of benchmark',            ppt: 0.0 },
        { id:'s4', label:'3–7% worse than benchmark',          ppt:-0.5 },
        { id:'s5', label:'More than 7% worse than benchmark',  ppt:-1.0 } ] },
    ],
  };
  // The worked example from the rule sheet, kept live against the current values.
  const EXAMPLE = [
    { group:'comp',     band:'c2', label:'4% cheaper than competitors' },
    { group:'demand',   band:'d1', label:'High demand and strong conversion' },
    { group:'basket',   band:'b4', label:'Package value of £3,500' },
    { group:'channel',  band:'paid', label:'Paid-search customer' },
    { group:'window',   band:'w2', label:'Departure in 20 days' },
    { group:'supplier', band:'s2', label:'Supplier cost 5% better than benchmark' },
  ];

  function load(){
    const d = JSON.parse(JSON.stringify(DEFAULTS));
    try{
      const raw = localStorage.getItem(KEY); if(!raw) return d;
      const p = JSON.parse(raw);
      if (typeof p.baseMargin === 'number') d.baseMargin = p.baseMargin;
      if (p.guardrails) Object.keys(d.guardrails).forEach(k=>{ if(typeof p.guardrails[k]==='number') d.guardrails[k]=p.guardrails[k]; });
      if (Array.isArray(p.groups)) d.groups.forEach(g=>{
        const pg=p.groups.find(x=>x.id===g.id); if(!pg) return;
        g.bands.forEach(b=>{ const pb=(pg.bands||[]).find(x=>x.id===b.id); if(pb&&typeof pb.ppt==='number') b.ppt=pb.ppt; });
      });
      return d;
    }catch(e){ return d; }
  }
  let M = load();
  function save(){ localStorage.setItem(KEY, JSON.stringify(M)); }
  const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const band=(gid,bid)=>{ const g=M.groups.find(x=>x.id===gid); return g&&g.bands.find(x=>x.id===bid); };
  const cls=v=> v>0?'pos':v<0?'neg':'';

  function renderGroups(){
    document.getElementById('mxGroups').innerHTML = M.groups.map(g=>{
      const span = Math.max(...g.bands.map(b=>b.ppt)) - Math.min(...g.bands.map(b=>b.ppt));
      return '<div class="mx-group">'+
        '<div class="mx-group-head">'+
          '<span class="mx-group-title">'+esc(g.label)+'</span>'+
          '<span class="mx-group-metric">'+esc(g.metric)+'</span>'+
          '<span class="mx-group-sum">range '+span.toFixed(1)+'ppt</span>'+
        '</div>'+
        '<table class="mx-bands"><tbody>'+
          g.bands.map(b=>'<tr>'+
            '<td class="mx-cond">'+esc(b.label)+'</td>'+
            '<td class="mx-input-cell">'+
              '<input type="number" class="mx-input '+cls(b.ppt)+'" step="0.5" value="'+b.ppt.toFixed(1)+'" '+
                'data-group="'+g.id+'" data-band="'+b.id+'" aria-label="'+esc(g.label+' — '+b.label)+'">'+
              '<span class="mx-unit">ppt</span>'+
            '</td></tr>').join('')+
        '</tbody></table></div>';
    }).join('');
  }

  function exampleRows(){
    let sum = 0;
    const rows = EXAMPLE.map(e=>{
      const b = band(e.group, e.band); const v = b ? b.ppt : 0; sum += v;
      return '<tr><td>'+esc(e.label)+'</td><td class="num '+(v>0?'up':v<0?'down':'flat')+'">'+
        (v>0?'+':'')+v.toFixed(1)+'ppt</td></tr>';
    }).join('');
    const gr = M.guardrails;
    const capped = Math.max(-gr.maxReduction, Math.min(gr.maxUplift, sum));
    const target = Math.max(gr.minMargin, Math.min(gr.maxMargin, M.baseMargin + capped));
    const notes = [];
    if (capped !== sum) notes.push('total movement capped at ' + (sum>0?'+':'') + capped.toFixed(1) + 'ppt');
    if (M.baseMargin + capped !== target) notes.push('clamped by the ' + (target===gr.minMargin?'minimum':'maximum') + ' margin guardrail');
    return { rows, sum, target, notes };
  }

  function renderSide(){
    const ex = exampleRows();
    const gr = M.guardrails;
    const g=(k,label,unit,step)=>'<div class="mx-row"><label for="gr_'+k+'">'+label+'</label>'+
      '<span><input type="number" class="mx-input mx-base-input" id="gr_'+k+'" data-gr="'+k+'" step="'+(step||0.5)+'" value="'+gr[k]+'"><span class="mx-unit">'+unit+'</span></span></div>';
    document.getElementById('mxSide').innerHTML =
      '<div class="mx-card">'+
        '<div class="mx-card-title">Base margin</div>'+
        '<div class="mx-row"><label for="mxBase">Starting margin on all eligible packages</label>'+
          '<span><input type="number" class="mx-input mx-base-input" id="mxBase" step="0.5" value="'+M.baseMargin.toFixed(1)+'"><span class="mx-unit">%</span></span></div>'+
      '</div>'+
      '<div class="mx-card">'+
        '<div class="mx-card-title">Guardrails</div>'+
        g('minMargin','Minimum margin','%')+
        g('maxMargin','Maximum margin','%')+
        g('maxUplift','Max total uplift from base','ppt')+
        g('maxReduction','Max total reduction from base','ppt')+
        g('minContribution','Min contribution per booking','£',5)+
        g('learningRange','Learning range around target','± ppt')+
      '</div>'+
      '<div class="mx-card">'+
        '<div class="mx-card-title">Worked example</div>'+
        '<table class="mx-example"><tbody>'+
          '<tr><td>Base margin</td><td class="num">'+M.baseMargin.toFixed(1)+'%</td></tr>'+
          ex.rows+
          '<tr class="total"><td>Calculated target margin</td><td class="num">'+ex.target.toFixed(1)+'%</td></tr>'+
        '</tbody></table>'+
        (ex.notes.length ? '<div class="mx-hint">'+esc(ex.notes.join(' · '))+'</div>' : '')+
      '</div>';
  }

  function renderKpis(){
    const maxUp = M.groups.reduce((s,g)=>s+Math.max(...g.bands.map(b=>b.ppt)),0);
    const maxDown = M.groups.reduce((s,g)=>s+Math.min(...g.bands.map(b=>b.ppt)),0);
    const gr = M.guardrails;
    document.getElementById('apKpis').innerHTML =
      '<div class="ap-kpi"><div class="label">Base margin</div><div class="value">'+M.baseMargin.toFixed(1)+'%</div></div>'+
      '<div class="ap-kpi k-auto"><div class="label">Theoretical max uplift</div><div class="value">+'+Math.min(maxUp,gr.maxUplift).toFixed(1)+
        '<span class="unit">ppt'+(maxUp>gr.maxUplift?' (capped)':'')+'</span></div></div>'+
      '<div class="ap-kpi k-review"><div class="label">Theoretical max reduction</div><div class="value">'+Math.max(maxDown,-gr.maxReduction).toFixed(1)+
        '<span class="unit">ppt'+(maxDown<-gr.maxReduction?' (capped)':'')+'</span></div></div>'+
      '<div class="ap-kpi"><div class="label">Margin corridor</div><div class="value">'+gr.minMargin.toFixed(0)+'–'+gr.maxMargin.toFixed(0)+'<span class="unit">%</span></div></div>';
  }

  function renderAll(){ renderGroups(); renderSide(); renderKpis(); }

  document.addEventListener('change', e=>{
    const t=e.target;
    if(t.classList.contains('mx-input')){
      const v=parseFloat(t.value);
      if(isNaN(v)){ renderAll(); return; }
      if(t.id==='mxBase') M.baseMargin=Math.max(0,Math.min(60,v));
      else if(t.dataset.gr) M.guardrails[t.dataset.gr]=Math.max(0,v);
      else if(t.dataset.group){
        const b=band(t.dataset.group,t.dataset.band);
        if(b) b.ppt=Math.max(-10,Math.min(10,Math.round(v*10)/10));
      }
      save(); renderAll();
      const toast=document.getElementById('appToast');
      toast.textContent='Rule saved — the Pricing page recalculates on next load';
      toast.classList.add('show');
      clearTimeout(window.__mt); window.__mt=setTimeout(()=>toast.classList.remove('show'),2400);
    }
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.classList.contains('mx-input')) e.target.blur();
  });
  document.getElementById('mxReset').addEventListener('click',()=>{
    M=JSON.parse(JSON.stringify(DEFAULTS)); save(); renderAll();
  });

  renderAll();
})();
</script>

</body>
